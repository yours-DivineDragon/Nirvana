[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nirvana-security"
version = "0.4.0"
description = "Local, evidence-gated security research orchestration for agentic coding tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nirvana contributors" }]
dependencies = []

[project.scripts]
nirvana = "nirvana.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/nirvana/schemas" = ["schemas/*.json"]
